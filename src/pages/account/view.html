<section class="account-page">
    <header class="account-page-header">
        <p class="account-eyebrow">TÀI KHOẢN</p>
        <h1>Thông tin cá nhân</h1>
    </header>

    <form id="profileForm" class="account-form">
        <h2>Hồ sơ</h2>
        <div class="form-group">
            <label for="profileName">Tên</label>
            <input id="profileName" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="form-group">
            <label for="profileEmail">Email</label>
            <input id="profileEmail" name="email" type="email" autocomplete="email" required>
        </div>
        <p id="profileMessage" class="account-message" role="status"></p>
        <button class="login-submit" type="submit">Lưu thay đổi</button>
    </form>

    <form id="changePasswordForm" class="account-form">
        <h2>Đổi mật khẩu</h2>
        <div class="form-group">
            <label for="oldPassword">Mật khẩu hiện tại</label>
            <input id="oldPassword" type="password" autocomplete="current-password" required>
        </div>
        <div class="form-group">
            <label for="newPassword">Mật khẩu mới</label>
            <input id="newPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label for="confirmNewPassword">Xác nhận mật khẩu mới</label>
            <input id="confirmNewPassword" type="password" autocomplete="new-password" required>
        </div>
        <p id="passwordMessage" class="account-message" role="status"></p>
        <button class="login-submit" type="submit">Cập nhật mật khẩu</button>
    </form>
</section>
